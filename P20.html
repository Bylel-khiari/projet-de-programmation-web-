<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Souris Filaire Gamer XG - Noir</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" 
              integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" 
              crossorigin="anonymous" referrerpolicy="no-referrer"> 
             <link rel="stylesheet" href="produit.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                 <h1> GAMING - ZONE </h1>
            </div>
            <ul class="menu">
                <li><a href="project.html" class="active">Accueil</a></li>
                <li><a href="Mon Compte.html"><i class="fa-solid fa-user"></i> Mon Compte </a></li>
                <li><a href="Panier.html"><i class="fa-solid fa-cart-shopping"></i> Panier</a></li>
            </ul>
        </nav>
<body>
    <main class="product-section">
        <div class="product-wrapper">
            <div class="image-gallery">
                <div class="main-photo">
                    <img id="featured-image" src="/projet e comerce/imgp20/souris-filaire-gaming-spider-x3-noir.jpg" alt="Featured Product">
                </div>
                <div class="thumbnails">
                    <img class="thumbnail" src="/projet e comerce/imgp20/souris-filaire-gaming-spider-x3-noir.jpg" alt="Gallery 1" onclick="updateImage('/projet e comerce/imgp20/souris-filaire-gaming-spider-x3-noir.jpg')">

                </div>
            </div>
            <div class="product-info">
                <h1>Souris Filaire Gamer XG - Noir</h1>
                <p class="description">
                    Souris Filaire Gaming SPIDER X3 - Technologie de connectivité : Filaire - Nombre de boutons: 3 - Interface : USB - Résolution: 1000dpi - Dimensions 110 x 63 x 33 mm - Poids 68g - Couleur Noir

                </p>
                <p class="price">Price: <strong>9,900 DT</strong></p>
                <button class="achat" onclick="addToCart('Souris Filaire Gamer XG - Noir', '9,900 DT')">ACHETER</button>
            </div>
        </div>
    </main>
    <script>
        function updateImage(src) {
            document.getElementById("featured-image").src = src;
        }

        function addToCart(productName, productPrice) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push({ name: productName, price: productPrice });
            localStorage.setItem('cart', JSON.stringify(cart));
            alert('Produit ajouté au panier');
        }
    </script>
</html>
